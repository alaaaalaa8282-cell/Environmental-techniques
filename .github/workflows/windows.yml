name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Ensure electron and electron-builder
        run: npm install --no-save electron electron-builder

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EcoTools-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
