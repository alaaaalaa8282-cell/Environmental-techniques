name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [ ia32, x64 ]

    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE (${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --${{ matrix.arch }} --publish never -c.artifactName=EcoTools-Windows-${{ matrix.arch }}.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EcoTools-Windows-${{ matrix.arch }}
          path: desktop/dist/*.exe
          if-no-files-found: error
