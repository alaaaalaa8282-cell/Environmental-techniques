name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create gradlew
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore and detect alias
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$STORE_PASSWORD" > "$RUNNER_TEMP/aliases.txt"
          cat "$RUNNER_TEMP/aliases.txt"
          ALIAS=$(grep -m1 "PrivateKeyEntry" "$RUNNER_TEMP/aliases.txt" | cut -d, -f1 | xargs)
          echo "Detected alias: $ALIAS"
          echo "DETECTED_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.DETECTED_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "EcoTools v1.0.${{ github.run_number }}" \
            --notes "Signed release APK"
