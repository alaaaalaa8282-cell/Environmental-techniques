<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشف الأثر البيئي</title>
<style>
:root{
  --bg:#EEF1EC; --surface:#FBFCFA; --ink:#15262B; --muted:#5A6B6F; --accent:#0F6B6E; --accent-ink:#fff; --line:#D3DAD4;
  --s1:#8FB39C; --s2:#D9B13B; --s3:#D8742F; --s4:#A8261F;
  --t1:#10261b; --t2:#2b2200; --t3:#2a1300; --t4:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101A1C; --surface:#172427; --ink:#E6EEEA; --muted:#98ABAA; --accent:#4FB3B3; --accent-ink:#06191a; --line:#2A3C3F; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 80px}
h1{font-size:1.55rem;margin:6px 0 2px;letter-spacing:0}
.sub{color:var(--muted);margin:0 0 16px;font-size:.98rem}
.search{position:relative}
#q{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);outline:none}
#q:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
#sug{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:20;overflow:hidden;display:none;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#sug button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer}
#sug button:last-child{border-bottom:0}
#sug button:hover,#sug button:focus{background:color-mix(in srgb,var(--accent) 12%,transparent)}
#sug small{color:var(--muted);margin-inline-start:auto}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:focus-visible,.chip-btn:focus-visible,summary:focus-visible,#q:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.hint{color:var(--muted)}
.browse summary{cursor:pointer;color:var(--accent);padding:6px 0}
.browse .sec{margin:10px 0 4px;font-weight:700}
.browse .names{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.head{display:flex;gap:12px;align-items:center;margin-top:18px}
.head .ic{font-size:2.2rem;line-height:1}
.head h2{margin:0;font-size:1.35rem}
.head p{margin:0;color:var(--muted);font-size:.92rem}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:14px 0}
.cell{border:0;border-radius:10px;padding:8px 6px;font:inherit;font-size:.86rem;cursor:pointer;text-align:center;line-height:1.35}
.cell b{display:block;font-size:1.05rem}
.cell.s1{background:var(--s1);color:var(--t1)} .cell.s2{background:var(--s2);color:var(--t2)} .cell.s3{background:var(--s3);color:var(--t3)} .cell.s4{background:var(--s4);color:var(--t4)}
.cell.s0{background:var(--surface);border:1px dashed var(--line);color:var(--muted);cursor:default}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.crit h3,.sect-title{margin:0 0 6px;font-size:1.05rem}
.crit ul{margin:0;padding-inline-start:20px}
.crit li{margin:3px 0}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.rec>button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;cursor:pointer;border-inline-start:6px solid var(--s1)}
.rec.s2>button{border-inline-start-color:var(--s2)} .rec.s3>button{border-inline-start-color:var(--s3)} .rec.s4>button{border-inline-start-color:var(--s4)}
.rec>button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.rec .nm{font-weight:700;font-size:1.05rem}
.rec .cnt{color:var(--muted);font-size:.88rem;margin-inline-start:auto}
.rec .body{display:none;padding:2px 14px 12px}
.rec.open .body{display:block}
.rec .caret{transition:transform .15s}
.rec.open .caret{transform:rotate(90deg)}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.item .t{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item .t b{font-size:1rem}
.sev{font-size:.78rem;padding:1px 10px;border-radius:999px;font-weight:700}
.sev.s1{background:var(--s1);color:var(--t1)} .sev.s2{background:var(--s2);color:var(--t2)} .sev.s3{background:var(--s3);color:var(--t3)} .sev.s4{background:var(--s4);color:var(--t4)}
.ph{font-size:.78rem;color:var(--muted)}
.item .p{margin:3px 0;color:var(--ink)}
.item details{margin-top:2px}
.item summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.item details p{margin:4px 0;font-size:.92rem;color:var(--muted)}
.item details p b{color:var(--ink)}
.panel{display:none}
.panel.show{display:block}
.grp{margin:12px 0 4px;font-weight:700}
.acts{display:flex;flex-direction:column;gap:2px}
.acts label{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;cursor:pointer}
.acts input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px}
.foot{color:var(--muted);font-size:.85rem;margin-top:18px}
.cls{margin:8px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.9rem}
.cls small{display:block;color:var(--muted);font-size:.78rem}
.sl{margin:8px 0;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sl summary{cursor:pointer;font-weight:600}
.sl .en{color:var(--muted);font-size:.78rem;font-weight:400;margin-inline-start:6px}
.sl p{margin:6px 0}
.sl .fn{color:var(--muted);font-size:.8rem;direction:ltr;text-align:left}
.toast{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.ctlb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;margin:2px;font:inherit;font-size:.88rem;cursor:pointer}
.ctlb:focus-visible,.mxc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cd{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-inline-start:4px solid var(--accent);border-radius:8px;padding:8px 12px;margin:6px 0}
.cd p{margin:4px 0;font-size:.92rem}.cd .en{color:var(--muted);font-size:.78rem;font-weight:400}.cd .fn{color:var(--muted);font-size:.8rem;direction:ltr;text-align:left}
.prt,.prtonly{display:none}
.mx{border-collapse:collapse;font-size:.82rem;min-width:100%}
.mx th,.mx td{padding:3px;text-align:center;border:1px solid var(--line)}
.mx th:first-child,.mx td:first-child{position:sticky;inset-inline-start:0;background:var(--surface);text-align:start;min-width:140px;z-index:1}
.mxc{width:100%;min-height:36px;border:0;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
.mxc.s1{background:var(--s1);color:var(--t1)}.mxc.s2{background:var(--s2);color:var(--t2)}.mxc.s3{background:var(--s3);color:var(--t3)}.mxc.s4{background:var(--s4);color:var(--t4)}
.mxc.sel{outline:3px solid var(--ink);outline-offset:1px}.mxn{color:var(--muted)}
@media (pointer:coarse){.ctlb{min-height:44px}.chip-btn{min-height:44px;padding:8px 14px}.btn{min-height:44px}.cell{min-height:56px}#sug button{min-height:48px}}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .noprint{display:none!important}.prt,.prtonly{display:block!important}
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--line:#999;--accent:#0F6B6E}
  body{background:#fff;color:#000} .search,.row-btns,.browse,.panel,.toast,#hero-note,#miss{display:none!important}
  .rec .body{display:block!important} .rec{break-inside:avoid;border-color:#999}
  .card{border-color:#999}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>كاشف الأثر البيئي</h1>
  <p class="sub" id="hero-note">اكتب أي مشروع أو نشاط، وهيظهرلك مين ممكن يتأثر وليه.</p>

  <div class="search">
    <input id="q" type="search" role="combobox" aria-controls="sug" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="مثلاً: مسلخ، محطة وقود، مصنع أسمنت…" aria-label="اسم المشروع">
    <div id="sug" role="listbox"></div>
  </div>

  <div id="miss" class="card" style="display:none"></div>

  <details class="browse card" id="browse">
    <summary>تصفح كل المشروعات حسب القطاع</summary>
    <div id="browseBody"></div>
  </details>

  <div id="result"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/*DATA*/
const ACT = [[1,"air","حرق وقود ثابت (غلايات، أفران، مولدات)","o","جسيمات PM2.5/PM10، NOx، SOx، CO، CO2، ومعادن ثقيلة مع الفحم والمازوت","الفحم والمازوت أخطر من الغاز. نسبة الكبريت في الوقود وارتفاع المدخنة يغيّران الخطورة.",[["AIR",3,"انبعاث من المدخنة ثم تشتت مع الرياح"],["PUB",3,"استنشاق جسيمات وغازات (ربو وأمراض قلب)"],["WRK",2,"تعرض قرب المصدر"],["PLT",2,"ترسيب حمضي على الأوراق والتربة"],["SWT",1,"ترسيب حمضي على المسطحات المائية"],["CLM",3,"ثاني أكسيد الكربون"]]],[2,"air","عوادم المركبات والمعدات الثقيلة","iod","NOx، جسيمات الديزل، CO، هيدروكربونات غير محترقة","أعلى في مرحلة الإنشاء لكثرة المعدات، وأقل مع المعدات الحديثة وصيانتها.",[["AIR",2,"عادم قرب الأرض يتجمع على الطرق"],["PUB",2,"تعرض السكان على الطرق المحيطة"],["WRK",2,"تعرض العمال في الموقع"],["CLM",2,"CO2 من الوقود"]]],[3,"air","غبار من الكسر والطحن والحفر","iod","PM10، PM2.5، وسيليكا حرة قابلة للتنفس إذا كان الصخر أو الرمل أو الخرسانة تحتوي كوارتز","الغبار الحاوي سيليكا حرة أخطر، وهو مرتبط بالصخور والرمل والخرسانة فقط. التغطية والرش بالماء يخفضانه كثيراً.",[["AIR",3,"غبار عالق تحمله الرياح"],["WRK",3,"استنشاق مزمن (تليّف رئوي سيليكوزيس)"],["PUB",2,"غبار على المساكن والطرق"],["VUL",3,"الأطفال ومرضى الجهاز التنفسي أكثر تأثراً"],["PLT",2,"طبقة غبار على الأوراق تقلل التمثيل الضوئي"],["LIV",2,"استنشاق وتلوث المرعى"]]],[4,"air","مناولة وتخزين مواد سائبة (أكوام، صوامع، تحميل)","o","غبار تطيّره الرياح من الأكوام ونقاط التفريغ","اتجاه الرياح، وتغطية الأكوام، والمسافة من السكان.",[["AIR",2,"تطاير من الأكوام ونقاط التحميل"],["PUB",2,"غبار على المناطق السكنية المجاورة"],["WRK",2,"تعرض عند التحميل والتفريغ"],["SEA",2,"فاقد مواد في الموانئ يصل لمياه البحر"]]],[5,"air","أبخرة المذيبات والدهانات (VOCs)","o","بنزين، تولوين، زيلين، كحوليات وكيتونات","وجود البنزين (مسرطن) يرفعها لدرجة أعلى. التهوية ومعالجة العادم تخفضانها.",[["WRK",3,"أعلى تعرض: تأثيرات عصبية وكبدية وتهيّج"],["AIR",2,"تكوّن الأوزون الأرضي مع NOx والشمس"],["PUB",2,"روائح وتهيّج قرب المصدر"]]],[6,"air","غازات حمضية ومهيّجة (SOx وNOx وHCl وHF وH2S والأمونيا const OVT = [null,["SO2 وNOx من فرن الكلنكر (من كبريت الخامات والوقود)، وكميات قليلة من HCl وHF من الخامات والوقود البديل. لا يوجد H2S","نوع الوقود (الفحم وبترول كوك أخطر من الغاز)، ونسبة الكبريت في الخامات، ومرشحات الغبار ووحدات الغسيل."],["جسيمات وNOx وSO2 وCO وCO2 وأثر لمعادن ثقيلة من وقود الفرن (فحم، بترول كوك، وقود بديل)","نوع الوقود ونسبة الكبريت وفلاتر الغبار."],["SO2 وNOx، وHF وHCl من حرق الطين والخامات في الأفران","نسبة الكبريت والفلور في الطين والوقود، ودرجة حرارة الحرق، ووجود غسيل غازات."],["NOx وSO2 وCO وCO2 وجسيمات من الأفران","نوع الوقود (الغاز أنظف من المازوت والفحم)."],["SO2 وNOx من فرن الصهر، وHF وHCl من مواد الصهر والتنقية","نوع الوقود (الغاز أنظف من المازوت)، ومواد التنقية، والفلاتر ووحدات الغسيل."],["رصاص وكادميوم وزرنيخ من مواد الصهر والألوان والزجاج المعاد","نوع مواد الصهر والفلاتر."],["SO2 وNOx من حرق المازوت أو السولار أو الغاز","نسبة الكبريت في الوقود، وطرق خفض NOx، وارتفاع المدخنة."],["NOx وSO2 وجسيمات وCO2 من المازوت أو السولار أو الغاز","نوع الوقود ونسبة الكبريت، وارتفاع المدخنة."],["NOx أساساً (الغاز الطبيعي يكاد يخلو من الكبريت)","تقنية الاحتراق منخفض NOx، وارتفاع المدخنة، وجودة الغاز."],["NOx وCO وCO2 (الغاز الطبيعي قليل الجسيمات والكبريت)","تقنية الاحتراق وارتفاع المدخنة."],["SO2 وNOx وHCl وHF من الفحم، مع زئبق وجسيمات دقيقة","نسبة الكبريت في الفحم، ووحدة إزالة الكبريت (FGD) ومعالجة NOx، والفلاتر."],["جسيمات ورماد متطاير وSO2 وNOx وCO2 وزئبق ومعادن ثقيلة من الفحم","نسبة الكبريت والرماد في الفحم، ومعالجة الغازات، وارتفاع المدخنة."],["SO2 وNOx من الأفران والتلبيد، وHF أحياناً من مواد الصهر","نوع الخام والوقود (الفحم)، ووحدات إزالة الغازات والفلاتر."],["جسيمات وNOx وSO2 وCO وCO2 من الأفران وملحقاتها","نوع الوقود وكفاءة الاحتراق وفلاتر الغازات."],["زنك ورصاص وكادميوم وديوكسينات من الخردة","نظافة الخردة وفلاتر الأكياس."],["أحماض تنظيف وزيوت وفلوكس وكيماويات معالجة المعادن","الاحتواء والتهوية."],["خبث وغبار فلاتر ملوث بمعادن وأحماض وحمأة طلاء","تثبيت الغبار وتخلص مرخص."],["مصادر مشعة مدفونة في الخردة وأجهزة قياس صناعية","كواشف إشعاع على بوابات الخردة."],["حمأة معادن وأحماض وهيدروكسيدات معدنية","تثبيت وتخلص مرخص."],["NOx وSO2 محدودة من الغاز والفحم","نوع الاختزال (غاز أم فحم)."],["SO2 من صهر الخامات والخردة، وأكاسيد النيتروجين","مصدر الرصاص (خام أم بطاريات)، وكفاءة غسيل الغازات ومرشحات الأكياس."],["رصاص وكادميوم وزرنيخ وSO2","كفاءة فلاتر الأكياس والتهوية الموضعية."],["أحماض كبريتيك وإلكتروليت ومحاليل معادن","الاحتواء الثانوي وفصل الأحماض."],["رصاص وكادميوم وزئبق ومثبطات لهب من أجهزة وبطاريات منتهية","فرز وتفكيك وتدوير عبر جهة مرخصة."],["فلوريد الهيدروجين (HF) وSO2 من خلايا الاختزال والأنودات","كفاءة تجميع الغازات ووحدات المعالجة الجافة، ونسبة الكبريت في الأنود."],["فلوريدات وهيدروكربونات عطرية حلقية (PAHs) وديوكسينات من خلايا الاختزال والخردة","نوع الخردة وكفاءة الفلاتر."],["رذاذ حمضي وSO2 من معالجة الخامات الكبريتيدية","طريقة المعالجة (تحميص أم ترشيح حمضي) وتغطية الأحواض."],["معادن ثقيلة وتصريف حمضي وزرنيخ","نوع الخام (كبريتيدي يعني تصريف حمضي) وتبطين البرك."],["كيماويات المعالجة (سيانيد، أحماض) وحمأة ومواد ملوثة","تخزين مرخص ومعالجة قبل التخلص."],["أحماض وقلويات ومحاليل ترشيح ومواد استخلاص","الاحتواء الثانوي وسلامة الخزانات."],["HF وSO2 محدودة من معالجة الخام ومعدات المعالجة الحرارية","طريقة التركيز والتجفيف ووجود وحدات معالجة."],["جبس فوسفاتي وكادميوم ومواد مشعة طبيعية","عزل المخلفات ومراقبة الإشعاع."],["مواد مشعة طبيعية (يورانيوم وثوريوم وراديوم ورادون) في الخام والمخلفات","عزل المخلفات ومراقبة الإشعاع والرادون."],["SO2 وH2S وCO من احتراق ذاتي لمخلفات الفحم وأكوامه","تبريد الأكوام وتغطيتها وإدارة مخلفات الفحم."],["كبريتيدات وتصريف حمضي وغبار فحم","تغطية الأكوام ومعالجة التصريف."],["ميثان من طبقات الفحم","التهوية وتصريف الميثان."],["SO2 وSO3 ورذاذ حمض الكبريتيك من وحدة التحويل والامتصاص","كفاءة التحويل (99% وأكثر) ومزيل الرذاذ وغسيل الغاز الخارج."],["SO2 وSO3 وأبخرة حمضية","كمية الغاز وكواشف التسرب."],["SO2 أو الكلور من وصلات ومضخات","الصيانة وكواشف الغاز."],["أحماض وقلويات وكلور مركّزة","خزانات ذات احتواء ثانوي وكواشف."],["مخلفات كيماوية وحمأة سامة وعبوات ملوثة وأحماض منتهية","تصنيف النفايات وتخلص مرخص."],["أدخنة سامة وأكاسيد وغازات احتراق، وانفجارات، ومياه إطفاء ملوثة بالكيماويات","احتواء مياه الإطفاء وفصل المتنافر ومنظومة الإنذار."],["حمأة معالجة الصرف الصناعي (قد تحوي معادن ومواد عضوية خاصة بالصناعة)","تحليل الحمأة قبل التخلص وتصنيفها خطرة أم لا."],["H2S وSO2 من وحدات استرجاع الكبريت وحرق الغاز","كفاءة الاسترجاع ووحدة معالجة الغاز الخارج."],["كبريتيد الهيدروجين (H2S) وSO2 من الغاز الحمضي","تركيز H2S، وكواشف الغاز، وخطة الإخلاء."],["مذيبات ومركبات عضوية متطايرة وغازات خاصة بالعملية","برنامج الصيانة وكشف التسريب."],["H2S وSO2 من الغاز الحمضي المتبقي","كفاءة الاسترجاع ووحدة معالجة الغاز الخارج."],["CO2 وNOx وCO وجسيمات من توربينات ومولدات الغاز والديزل","نوع الوقود (غاز أم ديزل) وساعات التشغيل."],["ميثان ومركبات عضوية متطايرة (VOCs) وأحياناً H2S","برنامج كشف وإصلاح التسريبات (LDAR) وصيانة الصمامات."],["حمأة نفطية ومحفزات مستهلكة ومخلفات حفر","التخزين المرخص والمعالجة قبل التخلص."],["HF وSiF4 وSO2 من تفاعل الصخر الفوسفاتي، وأمونيا","كفاءة أبراج الغسيل لامتصاص الفلوريد."],["أحماض (كبريتيك، فوسفوريك، نيتريك) وأمونيا وأسمدة سائلة","الاحتواء الثانوي وعزل الأحماض عن الأمونيا."],["أمونيا وNOx وأكاسيد النيتروجين من حمض النيتريك، وغبار الأسمدة","كفاءة غسيل الأمونيا وتحكم وحدة حمض النيتريك."],["أمونيا وكلور وغازات خاصة بالعملية","المواد المخزنة وكواشف الغاز والاحتواء."],["HCl وSO2 وغازات خاصة بالعملية الكيميائية","نوع المواد الخام والمنتج، وأبراج الغسيل."],["مواد كيميائية للعمليات والتنظيف: أحماض وقلويات ومذيبات ومواد سامة","تصنيف المواد (GHS) والفصل بين المتنافر والاحتواء الثانوي."],["مبيدات وسيطة ومنتجة وأسمدة (تسرب أو منتج غير مطابق)","ضبط الجودة واحتواء التسرب."],["NOx وCO وCO2 وجسيمات وSO2 من الغلايات والمولدات (وتتغير نسبها بنوع الوقود المختار)","نوع الوقود ونسبة الكبريت وارتفاع المدخنة."],["روائح مواد كيميائية ومذيبات (أستيرات، فينولات، فورمالديهيد)","إحكام الوحدات وسحب الأبخرة ومعالجتها."],["SO2 وH2S وNOx من الأفران ووحدات المعالجة والشعلة","نسبة الكبريت في الخام ووحدة استرجاع الكبريت."],["SO2 وNOx وجسيمات وCO2 من الأفران والغلايات","نسبة الكبريت في وقود المصفاة ومعالجة الغازات."],["مواد كيماوية للحفر والمعالجة (إيثيلين جلايكول، ميثانول، مثبطات تآكل، أحماض)","الاحتواء الثانوي ومنع التصريف."],["زيوت مستعملة وفلاتر وبطاريات ومذيبات وحمأة زيتية","جمع الزيوت وتسليمها لجهة مرخصة."],["H2S وSO2 من الغاز الحمضي والشعلة (إن كان الغاز حامضاً)","تركيز H2S في الغاز، وحرق أم استرجاع، وارتفاع الشعلة."],["كبريتيد الهيدروجين (H2S) وSO2 إن كان الغاز حامضاً","هل الغاز حامض أصلاً، وتركيز H2S، وكواشف الغاز، وخطة الإخلاء."],["CO2 وسناج وميثان غير محروق وNOx؛ وSO2 فقط إن كان الغاز حامضاً","حرق روتيني أم طوارئ فقط، وحجم الشعلة، وإمكانية استرجاع الغاز المصاحب."],["مياه إنتاج شديدة الملوحة تحمل زيتاً مشتتاً وهيدروكربونات ذائبة ومعادن ومواد مشعة طبيعية (NORM)","تركيز الزيت المصرّف (مرجع OSPAR: 30 mg/L متوسط شهري)، وإعادة الحقن بدل الصرف، والمعالجة قبل التصريف."],["ضوضاء تحت الماء من المسح السيزمي ودق الركائز والحفر وسفن الدعم","فترة المسح، وبدء تدريجي للتشغيل، ومراقبة الثدييات البحرية قبل البدء (منطقة 500 م)."],["نفط خام أو غاز من انفلات بئر (Blowout) أو تسرب خط أنابيب أو منصة","ضغط البئر وجاهزية مانع الانفجار (BOP)، وخطة الاستجابة للتسرب، وقرب الشعاب والمصايد ومحطات التحلية."],["تلف القاع بالمراسي وأرجل المنصة وخطوط الأنابيب أثناء التثبيت","موقع التثبيت بالنسبة للشعاب والأعشاب، ونظام المراسي، ومسار الخطوط."],["عكارة ورواسب وقطع حفر ومراسٍ وصرف حراري أو كيماوي قرب الشعاب والأعشاب","المسافة من الشعاب، وصرف الطين والقطع، ومنع المراسي في المناطق الحساسة."],["أنواع غريبة تدخل مع مياه الاتزان (الصابورة) لسفن الدعم والناقلات","معالجة مياه الاتزان وتبديلها في عرض البحر قبل التفريغ."],["منطقة أمان 500 م حول المنصة والخطوط تحجب مناطق صيد، وخطر اصطدام سفن الدعم بقوارب الصيد","التشاور مع الصيادين، والعلامات الملاحية، ومسارات سفن الدعم."],["H2S أساساً مع ثاني أكسيد الكربون من الأبخرة الجوفية","تركيز H2S في البخار ووحدات إزالته."],["مياه ساخنة مالحة بمعادن وزرنيخ وبورون","إعادة الحقن في الخزان."],["كبريتيد الهيدروجين (رائحة بيض فاسد) من الأبخرة الجوفية","تركيز H2S في البخار ووحدات إزالته."],["قشور سيليكا ومعادن (زرنيخ، بورون) من الأنابيب والآبار والمبادلات","ت function loadHash(){
  var m = {};
  location.hash.replace(/^#/,"").split("&").forEach(function(kv){ var i = kv.indexOf("="); if(i>0){ try{ m[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1)); }catch(e){} } });
  var ok = false;
  var pi = m.p===undefined ? -1 : (/^\d+$/.test(m.p) ? +m.p : PN.indexOf(norm(m.p)));
  if(pi>-1 && PROJ[pi]){ pick(pi); ok = true; }
  else if(m.c){ $("q").value = m.c; startCustom(m.c); ok = true; }
  if(!ok) return;
  if(["i","o","d"].indexOf(m.ph)>-1) state.phase = m.ph;
  if(m.cx){ var cx = m.cx.split(",").filter(function(x){ return CTX.some(function(c){ return c[0]===x; }); }); state.ctx = cx.length ? cx : null; }
  if(["gas","liq","coal","elec"].indexOf(m.fu)>-1) state.fuel = m.fu;
  if(m.v==="m") state.view = "matrix";
  if(m.a!==undefined){ state.acts = m.a.split(",").map(Number).filter(function(x,i,arr){ return ACTBY[x] && arr.indexOf(x)===i; }); }
  state._fresh = 1; render(); syncQuick();
}
function syncQuick(){ QUICK.forEach(function(q,ix){ var b = document.querySelector('#quick [data-q="'+ix+'"]'); if(!b) return; var on = q[1].every(function(id){ return state.acts.indexOf(id)>-1; }); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); }

document.addEventListener("click",function(e){
  var t = e.target.closest("button,input,summary"); if(!t) { if(!e.target.closest(".search")) $("sug").style.display="none"; return; }
  if(t.dataset.i!==undefined){ pick(+t.dataset.i); return; }
  if(t.dataset.custom){ startCustom($("q").value); return; }
  if(t.dataset.sl!==undefined){
    var pane = t.parentNode.nextElementSibling, kk = t.dataset.sl; if(!pane) return;
    if(pane.getAttribute("data-sl")===kk && pane.innerHTML){ pane.innerHTML = ""; pane.removeAttribute("data-sl"); return; }
    pane.setAttribute("data-sl", kk); pane.innerHTML = solBody(kk); return;
  }
  if(t.dataset.mx!==undefined){
    var pr = t.dataset.mx.split("|"), a0 = ACTBY[+pr[0]], L0 = window.__mx && window.__mx[t.dataset.mx], bx = $("mxWhy");
    document.querySelectorAll(".mxc.sel").forEach(function(z){ z.classList.remove("sel"); }); t.classList.add("sel");
    if(!a0 || !L0 || !bx) return;
    bx.innerHTML = '<b>'+esc(a0[2])+' ← '+esc(REC[pr[1]][0])+'</b> — '+SEV[L0.sev]+'<br>'+esc(L0.path)+'<br><small>'+esc(a0[3].split("").map(function(c){ return PHN[c]; }).join(" + "))+' · '+esc(ovx(a0)[1])+'</small><p><b>الملوثات:</b> '+esc(ovx(a0)[0])+'</p>'+inlineP(a0[0]);
    return;
  }
  if(t.id==="bView"){ state.view = state.view==="matrix" ? "list" : "matrix"; render(); return; }
  if(t.dataset.q!==undefined){ toggleQuick(+t.dataset.q, t); return; }
  if(t.dataset.ph){ state.phase = t.dataset.ph; render(); return; }
  if(t.dataset.fu){ state.fuel = t.dataset.fu==='none' ? null : t.dataset.fu; render(); return; }
  if(t.dataset.cx){
    var c = t.dataset.cx;
    if(c==="all") state.ctx = null;
    else { state.ctx = state.ctx || []; var q = state.ctx.indexOf(c); if(q>-1) state.ctx.splice(q,1); else state.ctx.push(c); if(!state.ctx.length) state.ctx=null; }
    render(); return;
  }
  if(t.dataset.go){ state.open[t.dataset.go]=true; render(); var s=$("r-"+t.dataset.go); if(s) s.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(t.dataset.tg){ var k=t.dataset.tg, sec=$("r-"+k); var o=!sec.classList.contains("open"); state.open[k]=o; sec.classList.toggle("open",o); t.setAttribute("aria-expanded",o); return; }
  if(t.id==="bEdit"){ state.panelOpen = !state.panelOpen; if(state.panelOpen) buildPanel(); else $("panel").classList.remove("show"); return; }
  if(t.id==="bCopy"){
    var txt = textReport(state.name, compute(state.acts,state.phase,state.gen,state.damp,state.ctx,state.fuel,state.up,state.inl), state.phase, state.proj>=0 ? CLS[PROJ[state.proj].n] : null);
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast("اتنسخ"); },function(){ toast("مقدرش ينسخ"); }); }
    else { var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ toast(document.execCommand("copy") ? "اتنسخ" : "مقدرش ينسخ"); }catch(_){ toast("مقدرش ينسخ"); } ta.remove(); }
    return;
  }
  if(t.id==="bLink"){
    var url = location.href;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ toast("اتنسخ الرابط"); },function(){ toast("مقدرش ينسخ"); }); }
    else toast("الرابط في شريط العنوان");
    return;
  }
  if(t.id==="bPrint"){ window.print(); return; }
  if(t.id==="bReset"){ state.acts = state.base.slice(); state.phase="all"; var P0=PROJ[state.proj]; state.ctx = P0.c?P0.c.slice():null; state.fuel = P0.f||null; render(); return; }
  if(t.dataset.a!==undefined && t.type==="checkbox"){
    var id=+t.dataset.a, k2=state.acts.indexOf(id);
    if(t.checked && k2<0) state.acts.push(id);
    if(!t.checked && k2>-1) state.acts.splice(k2,1);
    var y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
});
window.addEventListener("beforeprint",function(){ document.querySelectorAll("#result details").forEach(function(d){ d.open=true; }); });
$("q").addEventListener("input",showSug);
$("q").addEventListener("focus",showSug);
$("q").addEventListener("keydown",function(e){
  if(e.key==="ArrowDown"){ var b0 = $("sug").querySelector("button"); if(b0 && $("sug").style.display!=="none"){ e.preventDefault(); b0.focus(); return; } }
  if(e.key==="Enter"){
    e.preventDefault();
    var r = search($("q").value);
    if(FZ && r.length){ showSug(); return; }
    if(r.length && (r[0].exact || r.length===1 || (r[0].s>=300 && r[0].s-r[1].s>=10))) pick(r[0].i);
    else if(r.length) showSug();
    else if(norm($("q").value)) startCustom($("q").value);
  }
  if(e.key==="Escape") $("sug").style.display="none";
});
$("sug").addEventListener("keydown",function(e){
  var bs = Array.prototype.slice.call($("sug").querySelectorAll("button")), i = bs.indexOf(document.activeElement);
  if(e.key==="ArrowDown"){ e.preventDefault(); if(bs[i+1]) bs[i+1].focus(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(i>0) bs[i-1].focus(); else $("q").focus(); }
  else if(e.key==="Escape"){ $("sug").style.display="none"; $("q").setAttribute("aria-expanded","false"); $("q").focus(); }
});
(function buildBrowse(){
  var secs = {}, order = [];
  PROJ.forEach(function(p,i){ if(!secs[p.s]){ secs[p.s]=[]; order.push(p.s);} secs[p.s].push(i); });
  var h = "";
  order.forEach(function(s){
    h += '<div class="sec">'+esc(s)+' ('+secs[s].length+')</div><div class="names">';
    secs[s].forEach(function(i){ h += '<button class="chip-btn" data-i="'+i+'">'+PROJ[i].i+' '+esc(PROJ[i].n)+'</button>'; });
    h += '</div>';
  });
  $("browseBody").innerHTML = h;
})();
window.__loading = true; loadHash(); window.__loading = false;
</script>
