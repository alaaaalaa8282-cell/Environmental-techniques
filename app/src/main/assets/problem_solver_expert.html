<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔧 Problem Solver Expert | محلل المشاكل البيئية الخبير</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
:root{--primary:#1a365d;--secondary:#2c5282;--accent:#c53030;--success:#059669;--warning:#d97706;--info:#0284c7;--purple:#7c3aed;--bg:#f7fafc;--card:#fff;--text:#1a202c;--text-light:#4a5568;--border:#e2e8f0;--shadow:0 4px 6px rgba(0,0,0,0.07)}
body{background:var(--bg);color:var(--text);line-height:1.7}
.header{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:30px 20px;text-align:center;position:relative}
.header h1{font-size:2em;margin-bottom:8px}
.header p{opacity:0.9}
.lang-toggle{position:absolute;top:15px;left:15px;background:rgba(255,255,255,0.2);border:2px solid #fff;color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:bold}
.container{max-width:1300px;margin:0 auto;padding:25px 20px}
.search-box{background:var(--card);padding:20px;border-radius:10px;box-shadow:var(--shadow);margin-bottom:20px}
.search-input{width:100%;padding:12px 18px;border:2px solid var(--border);border-radius:8px;font-size:1em}
.search-input:focus{outline:none;border-color:var(--primary)}
.stats-bar{background:var(--card);padding:15px;border-radius:10px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:15px}
.stat-item{text-align:center}
.stat-number{font-size:1.8em;font-weight:bold;color:var(--primary)}
.stat-label{font-size:0.85em;color:var(--text-light)}
.category-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center}
.tab{padding:10px 20px;background:var(--card);border:2px solid var(--border);border-radius:25px;cursor:pointer;font-weight:bold;transition:all 0.3s}
.tab:hover{border-color:var(--primary)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab .count{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:0.8em;margin-right:5px}
.issues-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px;margin-bottom:25px}
.issue-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all 0.3s;position:relative}
.issue-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.issue-card.selected{border-color:var(--success);background:#f0fff4}
.issue-card .checkbox{position:absolute;top:12px;left:12px;width:24px;height:24px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;background:#fff}
.issue-card.selected .checkbox{background:var(--success);border-color:var(--success);color:#fff}
.issue-card.selected .checkbox::after{content:'✓';font-weight:bold}
.issue-card .icon{font-size:1.8em;margin-bottom:8px}
.issue-card h3{color:var(--primary);font-size:1.1em;margin-bottom:6px;padding-left:30px}
.issue-card .desc{color:var(--text-light);font-size:0.9em;margin-bottom:10px}
.issue-card .meta{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:12px;font-size:0.75em;font-weight:bold}
.badge-high{background:#fed7d7;color:#c53030}
.badge-medium{background:#fef3c7;color:#92400e}
.badge-low{background:#d1fae5;color:#065f46}
.badge-sector{background:#e0e7ff;color:#3730a3}
.selected-bar{background:var(--card);padding:18px;border-radius:10px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:10px;z-index:100}
.selected-count{font-size:1.1em;font-weight:bold;color:var(--primary)}
.btn{padding:12px 28px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:1em;transition:all 0.3s}
.btn-generate{background:var(--success);color:#fff}
.btn-generate:hover{background:#047857}
.btn-clear{background:var(--accent);color:#fff}
.btn-print{background:var(--primary);color:#fff}
.report-section{display:none;background:var(--card);padding:30px;border-radius:10px;box-shadow:var(--shadow);margin-top:20px}
.report-section.active{display:block}
.report-header{text-align:center;padding-bottom:20px;border-bottom:3px solid var(--primary);margin-bottom:30px}
.report-header h2{color:var(--primary);font-size:1.8em}
.problem-report{margin-bottom:35px;padding-bottom:25px;border-bottom:2px dashed var(--border)}
.problem-report:last-child{border-bottom:none}
.problem-title{background:linear-gradient(135deg,var(--accent),#9b2c2c);color:#fff;padding:15px 20px;border-radius:8px;margin-bottom:20px;font-size:1.3em}
.standards-box{background:#fef3c7;border-right:4px solid var(--warning);padding:12px;border-radius:6px;margin:12px 0}
[dir="ltr"] .standards-box{border-right:none;border-left:4px solid var(--warning)}
.standards-box strong{color:#92400e}
.standards-box .std-badge{display:inline-block;background:#92400e;color:#fff;padding:2px 8px;border-radius:10px;font-size:0.75em;margin:2px}
.solution-block{background:#f0fff4;border-right:4px solid var(--success);padding:15px;border-radius:6px;margin:12px 0}
[dir="ltr"] .solution-block{border-right:none;border-left:4px solid var(--success)}
.solution-block h4{color:var(--success);margin-bottom:10px}
.solution-item{background:#fff;padding:12px;border-radius:6px;margin:8px 0;border:1px solid var(--border)}
.solution-item strong{color:var(--primary)}
.abbreviation{background:var(--primary);color:#fff;padding:3px 10px;border-radius:12px;font-size:0.85em;margin-left:8px}
.when-to-use{background:#faf5ff;border-right:4px solid var(--purple);padding:12px;border-radius:6px;margin:10px 0}
[dir="ltr"] .when-to-use{border-right:none;border-left:4px solid var(--purple)}
.when-to-use strong{color:var(--purple)}
.when-to-use .tag{display:inline-block;background:var(--purple);color:#fff;padding:2px 8px;border-radius:10px;font-size:0.75em;margin:2px}
.emergency-block{background:#fff5f5;border-right:4px solid var(--accent);padding:15px;border-radius:6px;margin:12px 0}
[dir="ltr"] .emergency-block{border-right:none;border-left:4px solid var(--accent)}
.emergency-block h4{color:var(--accent);margin-bottom:10px}
.cap-block{background:#fffbeb;border-right:4px solid var(--warning);padding:15px;border-radius:6px;margin:12px 0}
[dir="ltr"] .cap-block{border-right:none;border-left:4px solid var(--warning)}
.cap-block h4{color:var(--warning);margin-bottom:10px}
.safety-block{background:#eff6ff;border-right:4px solid var(--secondary);padding:15px;border-radius:6px;margin:12px 0}
[dir="ltr"] .safety-block{border-right:none;border-left:4px solid var(--secondary)}
.safety-block h4{color:var(--secondary);margin-bottom:10px}
.monitoring-box{background:#e0f2fe;border-right:4px solid var(--info);padding:15px;border-radius:6px;margin:12px 0}
[dir="ltr"] .monitoring-box{border-right:none;border-left:4px solid var(--info)}
.monitoring-box h4{color:var(--info);margin-bottom:10px}
ul,ol{padding-right:25px;margin-top:8px}
[dir="ltr"] ul,[dir="ltr"] ol{padding-right:0;padding-left:25px}
li{margin:6px 0}
@media print{
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
.header,.search-box,.category-tabs,.issues-grid,.selected-bar,.lang-toggle,.stats-bar,.btn-print,.btn-clear{display:none!important}
.report-section{display:block!important;box-shadow:none;padding:0;margin:0}
.problem-report{page-break-inside:avoid;break-inside:avoid}
.problem-title{page-break-after:avoid;break-after:avoid}
.glossary-block table{page-break-inside:auto}
.glossary-block tr{page-break-inside:avoid;break-inside:avoid}
body{background:#fff}
@page{margin:1.5cm}
}
@media(max-width:768px){.issues-grid{grid-template-columns:1fr}.header h1{font-size:1.5em}}
</style>
</head>

</div>

<div id="reportSection" class="report-section">

<button class="btn btn-clear" onclick="closeReport()"> إغلاق التقرير</button>
</div>
<div id="reportContent"></div>
</div>
</div>

const glossarySorted=[...glossary].sort((a,b)=>b.abbr.length-a.abbr.length);
function expandAbbr(text){
if(!text)return text;
let result=text;
glossarySorted.forEach(g=>{
const esc=g.abbr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const re=new RegExp('(^|[^A-Za-z0-9(])('+esc+')(?![A-Za-z0-9])(?!\\s*\\()','g');
result=result.replace(re,(m,p1,p2)=>`${p1}${p2} (${g.full} - ${g.ar})`);
});
return result;
}

standards:['WHO Wastewater Guidelines','EPA Effluent Guidelines (40 CFR Part 400)','EU Urban Wastewater Directive 91/271/EEC'],

function init(){
renderCategories();
renderIssues();
updateStats();
}

function renderCategories(){
const tabs=document.getElementById('categoryTabs');
tabs.innerHTML='';
categories.forEach(cat=>{
const count=cat.id==='all'?issues.length:issues.filter(i=>i.category===cat.id).length;
const tab=document.createElement('div');
tab.className='tab'+(currentCategory===cat.id?' active':'');
tab.onclick=()=>{currentCategory=cat.id;renderCategories();renderIssues()};
tab.innerHTML=`${cat.icon} ${translations[currentLang][cat.id]} <span class="count">${count}</span>`;
tabs.appendChild(tab);
});
}

function renderIssues(){
const grid=document.getElementById('issuesGrid');
grid.innerHTML='';
const search=document.getElementById('searchInput').value.toLowerCase();
const filtered=issues.filter(i=>{
const matchCategory=currentCategory==='all'||i.category===currentCategory;
const matchSearch=!search||i.nameAr.toLowerCase().includes(search)||i.nameEn.toLowerCase().includes(search)||i.descAr.toLowerCase().includes(search);
return matchCategory&&matchSearch;
});
filtered.forEach(issue=>{
const card=document.createElement('div');
card.className='issue-card'+(selectedIssues.has(issue.id)?' selected':'');
card.onclick=()=>toggleIssue(issue.id);
const t=translations[currentLang];
card.innerHTML=`
<div class="checkbox"></div>
<div class="icon">${issue.icon}</div>
<h3>${currentLang==='ar'?issue.nameAr:issue.nameEn}</h3>
<div class="desc">${currentLang==='ar'?issue.descAr:issue.descEn}</div>
<div class="meta">
<span class="badge badge-${issue.severity}">${t[issue.severity]}</span>
${issue.sectors.slice(0,3).map(s=>`<span class="badge badge-sector">${s}</span>`).join('')}
</div>
`;
grid.appendChild(card);
});
}

function toggleIssue(id){
if(selectedIssues.has(id))selectedIssues.delete(id);
else selectedIssues.add(id);
renderIssues();
updateStats();
}

function updateStats(){
document.getElementById('selectedCount').textContent=selectedIssues.size;
document.getElementById('selectedCountBar').textContent=selectedIssues.size;
document.getElementById('totalIssues').textContent=issues.length;
document.getElementById('categoryCount').textContent=categories.length-1;
}

function clearSelection(){
selectedIssues.clear();
renderIssues();
updateStats();
}

function filterIssues(){renderIssues()}

function generateReport(){
if(selectedIssues.size===0){
alert(translations[currentLang].noSelection);
return;
}
const t=translations[currentLang];
const reportContent=document.getElementById('reportContent');
const today=new Date().toLocaleDateString(currentLang==='ar'?'ar-EG':'en-US',{year:'numeric',month:'long',day:'numeric'});

let html=`
<div class="report-header">
<h2>📊 ${t.reportTitle}</h2>
<p>${t.reportSubtitle}</p>
<p style="margin-top:10px;color:var(--text-light)">${currentLang==='ar'?'التاريخ':'Date'}: ${today} | ${currentLang==='ar'?'عدد المشاكل':'Problems'}: ${selectedIssues.size}</p>
</div>
`;

selectedIssues.forEach((id,idx)=>{
const issue=issues.find(i=>i.id===id);
if(!issue)return;
html+=`
<div class="problem-report">
<div class="problem-title">${idx+1}. ${issue.icon} ${currentLang==='ar'?issue.nameAr:issue.nameEn}</div>

<div class="standards-box">
<h4>📋 ${t.standards}</h4>
${issue.standards.map(s=>`<span class="std-badge">${expandAbbr(s)}</span>`).join(' ')}
</div>

<div class="solution-block">
<h4>✅ ${t.solution}</h4>
${issue.solutions.map((s,i)=>`
<div class="solution-item">
<strong>${i+1}. <span class="abbreviation">${s.abbr}</span> ${s.full}</strong><br>
<strong>${currentLang==='ar'?'الاسم بالعربي':'Arabic Name'}:</strong> ${s.ar}<br>
<strong>${t.mechanism}:</strong> ${expandAbbr(currentLang==='ar'?s.mechAr:s.mechEn)}
</div>
<div class="when-to-use">
<strong>${t.whenToUse}</strong><br>
<strong>${t.idealFor}:</strong> ${expandAbbr(currentLang==='ar'?s.whenAr.ideal:s.whenEn.ideal)}<br>
<strong>${t.advantages}:</strong> ${expandAbbr(currentLang==='ar'?s.whenAr.adv:s.whenEn.adv)}<br>
<strong>${t.limitations}:</strong> ${expandAbbr(currentLang==='ar'?s.whenAr.lim:s.whenEn.lim)}<br>
<strong>${t.examples}:</strong> ${expandAbbr(currentLang==='ar'?s.whenAr.ex:s.whenEn.ex)}
</div>
`).join('')}
</div>

<div class="emergency-block">
<h4>🚨 ${t.emergency}</h4>
<ol>${issue.emergency.map(e=>`<li>${expandAbbr(e)}</li>`).join('')}</ol>
</div>

<div class="cap-block">
<h4>🔧 ${t.cap}</h4>
<ol>${issue.cap.map(c=>`<li>${expandAbbr(c)}</li>`).join('')}</ol>
</div>

<div class="safety-block">
<h4>🦺 ${t.safety}</h4>
<ul>${issue.safety.map(s=>`<li>${expandAbbr(s)}</li>`).join('')}</ul>
</div>

${issue.category==='monitoring'?`
<div class="monitoring-box">
<h4>📡 ${currentLang==='ar'?'ملاحظات تقنية على أنظمة المراقبة':'Technical Notes on Monitoring Systems'}</h4>
<ul>
<li>${currentLang==='ar'?'<strong>CEMS (الثابت):</strong> الأدق، يقيس 24/7، يصل إلى PM1.0، مطلوب للمصانع الكبيرة وفق EPA':'<strong>CEMS (Fixed):</strong> Most accurate, measures 24/7, reaches PM1.0, required for large plants per EPA'}</li>
<li>${currentLang==='ar'?'<strong>Mobile Systems (المتحرك):</strong> مرن، يأخذ عينات من مواقع متعددة، مثالي للتفتيش':'<strong>Mobile Systems:</strong> Flexible, samples multiple locations, ideal for inspections'}</li>
<li>${currentLang==='ar'?'<strong>Satellite/GIS:</strong> يغطي مناطق واسعة، مثالي للكوارث والتغير المناخي':'<strong>Satellite/GIS:</strong> Covers large areas, ideal for disasters and climate change'}</li>
<li>${currentLang==='ar'?'<strong>Filter Sampling:</strong> الطريقة المرجعية (Reference Method)، الأدق للتحليل الكيميائي':'<strong>Filter Sampling:</strong> Reference Method, most accurate for chemical analysis'}</li>
<li>${currentLang==='ar'?'<strong>Portable Detectors:</strong> سريع للميدان، أقل دقة، للسلامة المهنية':'<strong>Portable Detectors:</strong> Fast for field, less accurate, for occupational safety'}</li>
</ul>
</div>
`:''}
</div>
`;
});

html+=`
<div style="margin-top:40px;padding-top:20px;border-top:2px solid var(--primary);text-align:center;color:var(--text-light);font-size:0.9em">
<p><strong>${currentLang==='ar'?'تم إعداد التقرير وفقاً للمعايير الدولية':'Report prepared according to international standards'}:</strong> EPA, WHO, IFC, ISO, IAEA, NFPA, OSHA</p>
<p><strong>${currentLang==='ar'?'ملاحظة':'Note'}:</strong> ${currentLang==='ar'?'يجب مراجعة التقرير من استشاري بيئي معتمد':'Must be reviewed by accredited environmental consultant'}</p>
</div>
`;

reportContent.innerHTML=html;
document.getElementById('reportSection').classList.add('active');
document.getElementById('reportSection').scrollIntoView({behavior:'smooth'});
}

function closeReport(){
document.getElementById('reportSection').classList.remove('active');
window.scrollTo({top:0,behavior:'smooth'});
}

function toggleLanguage(){
currentLang=currentLang==='ar'?'en':'ar';
document.documentElement.lang=currentLang;
document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
const t=translations[currentLang];
document.getElementById('mainTitle').textContent=t.mainTitle;
document.getElementById('mainSubtitle').textContent=t.mainSubtitle;
document.getElementById('searchInput').placeholder=t.searchPlaceholder;
document.getElementById('selectedLabel').textContent=t.selectedLabel;
document.getElementById('selectedLabelBar').textContent=t.selectedLabelBar;
document.getElementById('clearBtn').textContent=t.clearBtn;
document.getElementById('generateBtn').textContent=t.generateBtn;
document.getElementById('totalLabel').textContent=t.totalLabel;
document.getElementById('categoryLabel').textContent=t.categoryLabel;
document.querySelector('.lang-toggle').textContent=t.langBtn;
renderCategories();
renderIssues();
if(document.getElementById('reportSection').classList.contains('active')){
generateReport();
}
}

init();
</script>
</body>
</html>
